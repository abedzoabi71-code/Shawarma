<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<title>מפגש הכפר · הזמנות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;900&family=Frank+Ruhl+Libre:wght@700;900&family=Cairo:wght@400;600;800&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="appbar">
  <div class="brand">
    <div class="brand__mark" aria-hidden="true">מ</div>
    <div class="brand__text">
      <strong data-t="brand"></strong>
      <span data-t="brandSub"></span>
    </div>
  </div>
  <nav class="lang" aria-label="Language">
    <button type="button" data-lang="he">עב</button>
    <button type="button" data-lang="ar">ع</button>
    <button type="button" data-lang="en">EN</button>
  </nav>
</header>

<main>

<!-- ============ HOME ============ -->
<section class="screen" id="screen-home">

  <div class="hero">
    <!-- Replace the .photo div with: <img src="images/shawarma-spit.jpg" alt=""> -->
    <div class="hero__media"><div class="photo" data-photo="shawarma spit — vertical"></div><div class="hero__fade"></div></div>
    <div class="hero__body">
      <p class="pill"><span class="dot"></span><span data-t="openNow"></span></p>
      <h1 data-t="heroTitle"></h1>
      <p class="hero__sub" data-t="heroSub"></p>
      <ul class="facts">
        <li>
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.2"/><path d="M10 5.6V10l3 1.9"/></svg>
          <span data-t="eta"></span>
        </li>
        <li>
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="6" width="15" height="9" rx="1.6"/><path d="M2.5 9.5h15"/></svg>
          <span data-t="feeChip"></span>
        </li>
        <li>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3l2.1 4.3 4.7.7-3.4 3.3.8 4.7-4.2-2.2-4.2 2.2.8-4.7L3.2 8l4.7-.7z"/></svg>
          <span data-t="rating"></span>
        </li>
      </ul>
      <div class="hero__cta">
        <button type="button" class="btn btn--light" id="cta-menu" data-t="orderNow"></button>
        <!-- swap href for the real number -->
        <a class="btn btn--ghost btn--icon" href="tel:+972400000000" aria-label="Call">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="6" y="2.2" width="8" height="15.6" rx="2"/><path d="M8.8 15.2h2.4"/></svg>
        </a>
      </div>
    </div>
  </div>

  <nav class="cats" id="cats" aria-label="Menu categories"></nav>

  <div class="pad">
    <h2 class="display" id="cat-title"></h2>
    <p class="muted" data-t="menuHint"></p>
    <ul class="menu" id="menu"></ul>
  </div>

  <section class="band">
    <h3 class="display" data-t="whyTitle"></h3>
    <ol class="why" id="why"></ol>
  </section>

  <section class="pad">
    <h3 class="display" data-t="reviewsTitle"></h3>
    <div class="rail" id="reviews"></div>
  </section>

  <footer class="foot">
    <div class="display foot__name" data-t="brand"></div>
    <p><span data-t="address"></span><br><span data-t="hours"></span></p>
    <div class="foot__links">
      <a class="btn btn--ghost" href="tel:+972400000000">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="6" y="2.2" width="8" height="15.6" rx="2"/><path d="M8.8 15.2h2.4"/></svg>
        <span data-t="call"></span>
      </a>
      <!-- restaurant location on Waze -->
      <a class="btn btn--ghost" href="https://waze.com/ul?q=%D7%9E%D7%A4%D7%92%D7%A9%20%D7%94%D7%9B%D7%A4%D7%A8" target="_blank" rel="noopener">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 17.5s5.4-5 5.4-9a5.4 5.4 0 10-10.8 0c0 4 5.4 9 5.4 9z"/><circle cx="10" cy="8.4" r="2"/></svg>
        <span>Waze</span>
      </a>
    </div>
  </footer>
</section>

<!-- ============ ITEM BUILDER ============ -->
<section class="screen" id="screen-item" hidden>
  <div class="itemhero">
    <div class="photo photo--flat" id="item-photo"></div>
    <button type="button" class="round back" data-go="home" aria-label="Back">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg>
    </button>
  </div>
  <div class="pad">
    <div class="row-between">
      <h2 class="display" id="item-name"></h2>
      <strong class="price" id="item-price"></strong>
    </div>
    <p class="muted" id="item-desc"></p>

    <h3 class="q"><span data-t="breadQ"></span><em data-t="required"></em></h3>
    <div class="grid2" id="breads"></div>

    <h3 class="q"><span data-t="saladsQ"></span><small data-t="saladsFree"></small></h3>
    <div class="grid4" id="salads"></div>

    <h3 class="q"><span data-t="extrasQ"></span></h3>
    <div class="stack" id="extras"></div>

    <h3 class="q"><span data-t="noteQ"></span></h3>
    <textarea id="note" rows="2" class="note"></textarea>
  </div>
  <div class="bar">
    <div class="stepper">
      <button type="button" id="qty-minus" aria-label="−">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10h11"/></svg>
      </button>
      <span id="qty">1</span>
      <button type="button" id="qty-plus" aria-label="+">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11"/></svg>
      </button>
    </div>
    <button type="button" class="btn btn--dark btn--split" id="to-sides">
      <span data-t="addToCart"></span><span id="item-total"></span>
    </button>
  </div>
</section>

<!-- ============ SIDES UPSELL ============ -->
<section class="screen" id="screen-sides" hidden>
  <div class="pad">
    <p class="step" data-t="stepSides"></p>
    <h2 class="display" data-t="sidesTitle"></h2>
    <p class="muted" data-t="sidesSub"></p>
    <div class="stack" id="sides"></div>
  </div>
  <div class="bar">
    <button type="button" class="btn btn--outline" id="skip-sides" data-t="noThanks"></button>
    <button type="button" class="btn btn--dark btn--split" id="confirm-sides">
      <span id="sides-cta"></span><span id="sides-total"></span>
    </button>
  </div>
</section>

<!-- ============ DRINKS ============ -->
<section class="screen" id="screen-drinks" hidden>
  <div class="pad">
    <p class="step" data-t="stepDrinks"></p>
    <h2 class="display" data-t="drinksTitle"></h2>
    <p class="muted" data-t="drinksSub"></p>
    <div class="grid2" id="drinks"></div>
  </div>
  <div class="bar">
    <button type="button" class="btn btn--dark" data-go="cart" data-t="doneDrinks"></button>
  </div>
</section>

<!-- ============ CART ============ -->
<section class="screen" id="screen-cart" hidden>
  <div class="pad">
    <button type="button" class="linkback" data-go="home">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg>
      <span data-t="keepOrdering"></span>
    </button>
    <h2 class="display" data-t="cartTitle"></h2>
    <ul class="lines" id="cart"></ul>
    <div class="grid2 gap-s">
      <button type="button" class="btn btn--dashed" data-go="drinks" data-t="addDrinks"></button>
      <button type="button" class="btn btn--dashed" data-go="home" data-t="addMore"></button>
    </div>
    <dl class="totals" id="totals-cart"></dl>
  </div>
  <div class="bar">
    <button type="button" class="btn btn--dark" data-go="checkout" data-t="toCheckout"></button>
  </div>
</section>

<!-- ============ CHECKOUT ============ -->
<section class="screen" id="screen-checkout" hidden>
  <div class="pad">
    <button type="button" class="linkback" data-go="cart">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg>
      <span data-t="back"></span>
    </button>
    <h2 class="display" data-t="checkoutTitle"></h2>

    <h3 class="q"><span data-t="addressQ"></span></h3>
    <input class="field" id="address" type="text" autocomplete="street-address">
    <button type="button" class="option waze" id="waze">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 17.5s5.4-5 5.4-9a5.4 5.4 0 10-10.8 0c0 4 5.4 9 5.4 9z"/><circle cx="10" cy="8.4" r="2"/></svg>
      <span class="option__text"><strong id="waze-title"></strong><small id="waze-sub"></small></span>
      <svg class="option__check" viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></svg>
    </button>

    <h3 class="q"><span data-t="payQ"></span></h3>
    <div class="stack" id="payments"></div>

    <dl class="totals" id="totals-checkout"></dl>
  </div>
  <div class="bar">
    <button type="button" class="btn btn--dark" id="place" disabled></button>
  </div>
</section>

<!-- ============ CONFIRMATION ============ -->
<section class="screen" id="screen-done" hidden>
  <div class="done">
    <div class="done__mark">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></svg>
    </div>
    <h2 class="display" data-t="doneTitle"></h2>
    <p class="muted" data-t="doneBody"></p>
    <dl class="receipt" id="receipt"></dl>
    <button type="button" class="btn btn--outline" id="reset" data-t="newOrder"></button>
  </div>
</section>

</main>

<!-- floating cart bar (home only) -->
<button type="button" class="cartbar" id="cartbar" hidden data-go="cart">
  <span><em id="cartbar-count"></em><span data-t="viewCart"></span></span>
  <strong id="cartbar-total"></strong>
</button>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
